name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      # El wrapper usa distributionType=only-script: cada ejecución baja Maven de
      # repo.maven.apache.org. Esa descarga ya falló una vez (wget, exit 1, antes de
      # compilar nada), así que se cachea y se reintenta por separado del build.
      - name: Caché de la distribución de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Obtener Maven
        run: |
          for intento in 1 2 3; do
            if ./mvnw -B --version; then exit 0; fi
            echo "Intento $intento: no se pudo obtener Maven; se reintenta en 15 s" >&2
            sleep 15
          done
          echo "Maven no se pudo descargar tras 3 intentos" >&2
          exit 1
      - name: Build and test
        run: ./mvnw -B verify
