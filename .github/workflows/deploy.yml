name: Deploy

on:
  workflow_dispatch:   # manual por ahora; después se cambia a push en main

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yuyay-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Desplegar en EC2 por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:latest
            docker stop yuyay || true
            docker rm yuyay || true
            docker run -d --name yuyay --restart unless-stopped \
              --env-file ~/.env -p 8080:8080 ${{ env.IMAGE }}:latest