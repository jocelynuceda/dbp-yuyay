name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yuyay-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Mientras no exista el secret, se construye y publica la imagen pero no se despliega.
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Tests antes de desplegar
        run: ./mvnw -B verify

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Desplegar en EC2 por SSH
        if: env.EC2_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # El token de Actions solo vale durante este job: basta para el pull y no queda una credencial permanente en el EC2.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker logout ghcr.io
            docker stop yuyay || true
            docker rm yuyay || true
            docker run -d --name yuyay --restart unless-stopped \
              --env-file ~/.env -p 8080:8080 ${{ env.IMAGE }}:${{ github.sha }}
            docker image prune -f

      - name: Comprobar /actuator/health
        if: env.EC2_HOST != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fs "http://${EC2_HOST}:8080/actuator/health" | grep -q '"UP"'; then
              echo "API arriba"; exit 0
            fi
            sleep 5
          done
          echo "La API no respondió UP en 150 s"; exit 1
