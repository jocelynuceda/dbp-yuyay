services:
  db:
    image: postgres:16-alpine
    container_name: yuyay-db
    environment:
      POSTGRES_DB: yuyay
      POSTGRES_USER: yuyay
      POSTGRES_PASSWORD: yuyay
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - yuyay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuyay -d yuyay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yuyay-db-data:
