<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablece tu contraseña de Yuyay</title>
</head>
<body>
<h2>Restablece tu contraseña</h2>

<p>
    Hola <strong th:text="${userName}">usuario</strong>, usa este código en la app:
</p>

<p style="font-size: 28px; letter-spacing: 6px;"><strong th:text="${code}">000000</strong></p>

<p>
    Vence en <span th:text="${minutesValid}">15</span> minutos. Si no lo pediste,
    ignora este correo: tu contraseña sigue igual.
</p>

<p>Yuyay</p>
</body>
</html>
