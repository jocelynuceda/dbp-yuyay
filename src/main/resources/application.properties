spring.application.name=yuyay
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:60}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
app.google.client-ids=${GOOGLE_CLIENT_IDS:}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:3000}
# La web en Vercel (producción y vistas previas de cada rama) llama a /api a través de su propio proxy
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://yuyay-web.vercel.app,https://yuyay-frontend.vercel.app,https://yuyay-frontend-*-jocelynucedas-projects.vercel.app}
app.mail.from=${MAIL_FROM:Yuyay <onboarding@resend.dev>}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.log-contents=${MAIL_LOG_CONTENTS:false}

# Correo por SMTP (alternativa a Resend: entrega a cualquier destinatario sin
# dominio propio). Se usa solo si hay MAIL_SMTP_USERNAME y no hay RESEND_API_KEY.
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Edad mínima para que una persona reciba su propio perfil. Requiere revisión legal: el piso del
# reglamento de la Ley 29733 es 14 años. Ver docs/modelo-autocuidado-y-recordatorios.md §3.5.
app.care.self-claim-min-age=${SELF_CLAIM_MIN_AGE:16}
app.care.claim-invitation-valid-days=${CLAIM_INVITATION_VALID_DAYS:7}

# Consulta de DNI (miapi.cloud). Sin RENIEC_API_TOKEN no se consulta nada y toda consulta
# queda "no disponible". Devuelve nombres y fecha de nacimiento: sirve para contrastar el nombre
# y la edad mínima, no la identidad de quien usa el DNI.
# Caddy reconstruye X-Forwarded-For y el puerto del contenedor solo se publica en loopback.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${YUYAY_TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128,172.17.0.1/32}
app.registration.dni-per-origin=${REGISTRATION_DNI_PER_ORIGIN:5}
app.registration.dni-daily-limit=${REGISTRATION_DNI_DAILY_LIMIT:50}
app.registration.min-age=${REGISTRATION_MIN_AGE:16}
app.reniec.base-url=${RENIEC_BASE_URL:https://miapi.cloud}
app.reniec.api-token=${RENIEC_API_TOKEN:}
app.reniec.connect-timeout-seconds=${RENIEC_CONNECT_TIMEOUT_SECONDS:3}
app.reniec.read-timeout-seconds=${RENIEC_READ_TIMEOUT_SECONDS:5}

app.admin.email=${ADMIN_EMAIL:admin@yuyay.app}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrador Yuyay}
app.demo.password=${DEMO_PASSWORD:}
app.document-scope.enabled=${DOCUMENT_SCOPE_ENABLED:false}
app.document-scope.min-coverage=${DOCUMENT_SCOPE_MIN_COVERAGE:0.50}
app.document-scope.strike-min-coverage=${DOCUMENT_SCOPE_STRIKE_MIN_COVERAGE:0.65}
# OCR rate limit per user (0 disables each rule)
app.ocr.min-interval-seconds=${OCR_MIN_INTERVAL_SECONDS:5}
app.ocr.daily-limit=${OCR_DAILY_LIMIT:30}
app.ocr.max-pending=${OCR_MAX_PENDING:3}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3-bucket=${AWS_S3_BUCKET:}

app.storage.type=${STORAGE_TYPE:s3}
app.storage.local-dir=${STORAGE_LOCAL_DIR:${user.home}/.yuyay/uploads}

# Recordatorios de citas (issue #71): un aviso el día anterior a la hora indicada, en la zona de las citas
app.reminders.enabled=${REMINDERS_ENABLED:true}
app.reminders.zone=${REMINDERS_ZONE:America/Lima}
app.reminders.send-at=${REMINDERS_SEND_AT:18:00}
app.reminders.max-email-attempts=3
app.reminders.interval=PT5M
