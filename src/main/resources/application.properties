spring.application.name=yuyay
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:60}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.mail.from=${MAIL_FROM:Yuyay <onboarding@resend.dev>}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.admin.email=${ADMIN_EMAIL:admin@yuyay.app}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrador Yuyay}
