spring.datasource.url=jdbc:h2:mem:yuyay;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789
app.jwt.access-expiration-minutes=60
app.jwt.refresh-expiration-days=7
app.mail.resend-api-key=
app.admin.email=admin@yuyay.app
app.admin.password=Admin12345
app.admin.name=Administrador Yuyay
# The test profile disables the OCR limits; the rate-limit tests enable them explicitly.
app.ocr.min-interval-seconds=0
app.ocr.daily-limit=0
app.ocr.max-pending=0
# Las pruebas llaman al servicio con un reloj controlado; el proceso programado no corre
app.reminders.enabled=false
# Las pruebas de cuota definen límites pequeños en su propio contexto.
app.registration.dni-per-origin=10000
app.registration.dni-daily-limit=10000
